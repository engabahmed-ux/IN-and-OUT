<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IN AND OUT - Car & Carpet Wash Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background: #0b1320;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      touch-action: none;
      color: #fff;
    }

    #hubScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #111c30 0%, #060b13 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .brand-header {
      text-align: center;
      margin-bottom: 18px;
    }
    .brand-header svg {
      width: 140px;
      height: auto;
      margin-bottom: 6px;
    }
    .brand-header h1 {
      font-size: 20px;
      color: #38bdf8;
      font-weight: 900;
    }
    .brand-header p {
      font-size: 13px;
      color: #94a3b8;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 350px;
    }
    .game-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .game-card:active {
      transform: scale(0.96);
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
    }
    .game-card .icon { font-size: 30px; margin-bottom: 6px; }
    .game-card .title { font-size: 14px; font-weight: bold; color: #f8fafc; }
    .game-card .badge {
      display: inline-block;
      font-size: 10px;
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      padding: 2px 8px;
      border-radius: 8px;
      margin-top: 4px;
    }

    .top-bar {
      display: none;
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 16px;
      border-radius: 30px;
      align-items: center;
      gap: 12px;
      z-index: 20;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      white-space: nowrap;
    }
    .btn-back-hub {
      background: #334155;
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .hud-title { font-weight: bold; font-size: 13px; color: #38bdf8; }

    .stat-badge {
      background: #1e293b;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      color: #00e676;
      border: 1px solid rgba(255,255,255,0.1);
    }

    #gameCanvas {
      display: none;
      width: 100vw;
      height: 100vh;
    }

    #nozzleCursor {
      position: fixed;
      width: 40px;
      height: 40px;
      border: 2px dashed rgba(56, 189, 248, 0.9);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 5;
    }

    .weapons-bar {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 35px;
      padding: 6px 12px;
      gap: 8px;
      z-index: 15;
    }
    .weapon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid transparent;
      border-radius: 25px;
      padding: 6px 12px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .weapon-btn.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* واجهة لعبة عجلة الحظ */
    #wheelUI {
      display: none;
      position: fixed;
      inset: 0;
      background: #0f172a;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 20px;
    }
    .wheel-container {
      position: relative;
      width: 270px;
      height: 270px;
      margin-bottom: 25px;
    }
    #wheelCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      transition: transform 4s cubic-bezier(0.12, 0.9, 0.18, 1);
    }
    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 26px;
      z-index: 2;
    }
    .stage-btn {
      width: 100%;
      max-width: 250px;
      padding: 14px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      color: #04101e;
      cursor: pointer;
    }

    /* نافذة الفوز والطلب */
    .win-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(11, 19, 32, 0.9);
      backdrop-filter: blur(8px);
      z-index: 150;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .win-modal.active { display: flex; }
    .modal-card {
      background: #111c30;
      border: 2px solid #38bdf8;
      border-radius: 24px;
      padding: 22px 20px;
      width: 100%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }
    .discount-badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px dashed #38bdf8;
      color: #38bdf8;
      font-size: 16px;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 10px;
      margin-bottom: 12px;
      display: inline-block;
    }
    .order-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: right;
    }
    .order-form input, .order-form select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      background: #0b1320;
      border: 1px solid #1e293b;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .submit-btn {
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- القائمة الرئيسية -->
  <div id="hubScreen">
    <div class="brand-header">
      <svg viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M200 10 L370 50 V150 C370 200 200 235 200 235 C200 235 30 200 30 150 V50 L200 10 Z" fill="#0f1c30" stroke="#94a3b8" stroke-width="8"/>
        <rect x="20" y="100" width="360" height="65" rx="10" fill="#0b1320" stroke="#cbd5e1" stroke-width="5"/>
        <text x="200" y="146" font-family="'Impact', sans-serif" font-weight="bold" font-style="italic" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="3">IN AND OUT</text>
        <text x="200" y="185" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="16" fill="#38bdf8" text-anchor="middle" letter-spacing="4">CAR & CARPET WASH</text>
      </svg>
      <h1>مركز تحديات النظافة الذكية ✨</h1>
      <p>كل لعبة تمنحك كود خصم مختلف حسب سرعتك وذكائك!</p>
    </div>

    <div class="games-grid">
      <div class="game-card" onclick="launchGame('WASHER')">
        <div class="icon">🔫</div>
        <div class="title">مسدس الضغط</div>
        <span class="badge">خصم 20%</span>
      </div>
      <div class="game-card" onclick="launchGame('RUNNER')">
        <div class="icon">🏃‍♂️</div>
        <div class="title">رول السجاد</div>
        <span class="badge">خصم 25%</span>
      </div>
      <div class="game-card" onclick="launchGame('FACTORY')">
        <div class="icon">⚙️</div>
        <div class="title">المغسلة الذكية</div>
        <span class="badge">خصم 15%</span>
      </div>
      <div class="game-card" onclick="launchGame('WHEEL')">
        <div class="icon">🎡</div>
        <div class="title">عجلة الحظ</div>
        <span class="badge">جوائز متنوعة</span>
      </div>
    </div>
  </div>

  <!-- الشريط العلوي أثناء اللعب -->
  <div class="top-bar" id="gameTopBar">
    <button class="btn-back-hub" onclick="backToHub()">🏠 القائمة</button>
    <div class="hud-title" id="hudTitle">التحدي</div>
    <div class="stat-badge" id="statBadge">0%</div>
  </div>

  <div id="nozzleCursor"></div>
  <canvas id="gameCanvas"></canvas>

  <!-- أسلحة مسدس الضغط -->
  <div class="weapons-bar" id="washerWeapons">
    <button class="weapon-btn active" id="btnHose">🔫 مسدس</button>
    <button class="weapon-btn" id="btnBucket">🪣 جردل</button>
    <button class="weapon-btn" id="btnBomb">💣 قنبلة</button>
  </div>

  <!-- واجهة عجلة الحظ -->
  <div id="wheelUI">
    <div class="wheel-container">
      <div class="wheel-pointer">🔻</div>
      <canvas id="wheelCanvas" width="300" height="300"></canvas>
    </div>
    <button class="stage-btn" id="spinWheelBtn">لف العجلة واكسب 🎯</button>
  </div>

  <!-- نافذة الفوز وتسجيل الحجز -->
  <div class="win-modal" id="winModal">
    <div class="modal-card">
      <div style="font-size: 38px; margin-bottom: 4px;">🏆🎉</div>
      <h2 id="winMainTitle">ألف مبروك!</h2>
      <p id="winSubText" style="font-size: 13px; color: #94a3b8; margin-bottom: 12px;"></p>
      
      <div class="discount-badge" id="discountBadge">كود الخصم: ...</div>

      <form class="order-form" id="orderForm">
        <input type="text" id="custName" placeholder="الاسم الكريم" required>
        <input type="tel" id="custPhone" placeholder="رقم الموبايل / واتساب" required>
        <input type="text" id="custAddress" placeholder="العنوان بالتفصيل" required>
        <select id="serviceType">
          <option value="غسيل سجاد - استلام وتوصيل">غسيل سجاد (استلام وتوصيل منزلي)</option>
          <option value="غسيل وتلميع سيارة">غسيل وتلميع سيارات (Car Wash)</option>
          <option value="سجاد + سيارة (عرض خاص)">باقة كاملة: سجاد + غسيل سيارة</option>
        </select>
        <button type="submit" class="submit-btn">تأكيد الحجز وتطبيق الخصم عبر واتساب 💬</button>
      </form>
    </div>
  </div>

  <script>
    const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbweP5a-8B1xKKJi-7U1N3Yh9od5LulIPjNXNSOK0gRWsn2P5TUoTYMrBin6b2736e4p/exec";
    const BUSINESS_WHATSAPP_PHONE = "201009204577";

    let currentGame = null;
    let currentDiscountCode = "";
    let currentDiscountOffer = "";

    const hubScreen = document.getElementById('hubScreen');
    const topBar = document.getElementById('gameTopBar');
    const hudTitle = document.getElementById('hudTitle');
    const statBadge = document.getElementById('statBadge');
    const nozzleCursor = document.getElementById('nozzleCursor');

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const washerWeapons = document.getElementById('washerWeapons');
    const wheelUI = document.getElementById('wheelUI');
    const winModal = document.getElementById('winModal');
    const discountBadge = document.getElementById('discountBadge');
    const orderForm = document.getElementById('orderForm');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    /* Audio Synthesizer */
    let audioCtx = null;
    let hoseNoiseGain = null;

    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1250, audioCtx.currentTime);
        filter.Q.setValueAtTime(1.6, audioCtx.currentTime);

        hoseNoiseGain = audioCtx.createGain();
        hoseNoiseGain.gain.setValueAtTime(0, audioCtx.currentTime);

        whiteNoise.connect(filter);
        filter.connect(hoseNoiseGain);
        hoseNoiseGain.connect(audioCtx.destination);
        whiteNoise.start(0);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function setHoseSound(active) {
      unlockAudio();
      if (hoseNoiseGain && audioCtx) {
        const targetVol = active ? 0.35 : 0.0001;
        hoseNoiseGain.gain.cancelScheduledValues(audioCtx.currentTime);
        hoseNoiseGain.gain.setValueAtTime(hoseNoiseGain.gain.value, audioCtx.currentTime);
        hoseNoiseGain.gain.linearRampToValueAtTime(targetVol, audioCtx.currentTime + 0.04);
      }
      if (active && navigator.vibrate) navigator.vibrate(25);
    }

    function playWaterExplosion() {
      unlockAudio();
      const subOsc = audioCtx.createOscillator();
      const subGain = audioCtx.createGain();
      subOsc.type = 'sine';
      subOsc.frequency.setValueAtTime(140, audioCtx.currentTime);
      subOsc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.6);
      subGain.gain.setValueAtTime(0.7, audioCtx.currentTime);
      subGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
      subOsc.connect(subGain);
      subGain.connect(audioCtx.destination);
      subOsc.start();
      subOsc.stop(audioCtx.currentTime + 0.6);

      if (navigator.vibrate) navigator.vibrate([60, 30, 90]);
    }

    function playBeep(freq = 400, dur = 0.2) {
      unlockAudio();
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      g.gain.setValueAtTime(0.2, audioCtx.currentTime);
      g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + dur);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }

    function triggerWin(title, sub, discountText, codePrefix) {
      setHoseSound(false);
      currentDiscountOffer = discountText;
      currentDiscountCode = `${codePrefix}-${Math.floor(1000 + Math.random() * 9000)}`;
      document.getElementById('winMainTitle').innerText = title;
      document.getElementById('winSubText').innerText = sub;
      discountBadge.innerText = `كود الهدية: ${currentDiscountCode} (${discountText})`;
      winModal.classList.add('active');
    }

    function backToHub() {
      setHoseSound(false);
      currentGame = null;
      canvas.style.display = 'none';
      nozzleCursor.style.display = 'none';
      washerWeapons.style.display = 'none';
      wheelUI.style.display = 'none';
      topBar.style.display = 'none';
      winModal.classList.remove('active');
      hubScreen.style.display = 'flex';
    }

    function launchGame(game) {
      unlockAudio();
      currentGame = game;
      hubScreen.style.display = 'none';
      topBar.style.display = 'flex';

      if (game === 'WASHER') initWasherGame();
      else if (game === 'RUNNER') initRunnerGame();
      else if (game === 'FACTORY') initFactoryGame();
      else if (game === 'WHEEL') initWheelGame();
    }

    /* ================= 1. لعبة مسدس الضغط (WASHER) ================= */
    let cleanCanvas, cleanCtx, dirtyCanvas, dirtyCtx;
    let selectedWeapon = "HOSE";
    let isWashing = false, activeBombs = [], waterParticles = [], shockwaves = [];
    let isWasherWon = false;

    function initWasherGame() {
      hudTitle.innerText = "مسدس الضغط";
      statBadge.innerText = "0%";
      canvas.style.display = 'block';
      washerWeapons.style.display = 'flex';
      isWasherWon = false;

      cleanCanvas = document.createElement('canvas');
      cleanCtx = cleanCanvas.getContext('2d');
      dirtyCanvas = document.createElement('canvas');
      dirtyCtx = dirtyCanvas.getContext('2d');
      cleanCanvas.width = dirtyCanvas.width = width;
      cleanCanvas.height = dirtyCanvas.height = height;

      cleanCtx.fillStyle = '#0f172a';
      cleanCtx.fillRect(0, 0, width, height);
      cleanCtx.strokeStyle = '#38bdf8';
      cleanCtx.lineWidth = 12;
      cleanCtx.strokeRect(25, 25, width - 50, height - 50);

      cleanCtx.fillStyle = '#1e3a8a';
      cleanCtx.beginPath();
      cleanCtx.arc(width / 2, height / 2, Math.min(width, height) * 0.28, 0, Math.PI * 2);
      cleanCtx.fill();

      cleanCtx.fillStyle = '#0284c7';
      cleanCtx.beginPath();
      cleanCtx.arc(width / 2, height / 2, Math.min(width, height) * 0.18, 0, Math.PI * 2);
      cleanCtx.fill();

      dirtyCtx.fillStyle = '#38220f';
      dirtyCtx.fillRect(0, 0, width, height);
      for (let i = 0; i < 40; i++) {
        dirtyCtx.fillStyle = i % 2 === 0 ? '#1c0f05' : '#261408';
        dirtyCtx.beginPath();
        dirtyCtx.arc(Math.random() * width, Math.random() * height, Math.random() * 55 + 25, 0, Math.PI * 2);
        dirtyCtx.fill();
      }
    }

    document.getElementById('btnHose').onclick = () => { selectedWeapon = "HOSE"; updateWeaponBtns(); };
    document.getElementById('btnBucket').onclick = () => { selectedWeapon = "BUCKET"; updateWeaponBtns(); };
    document.getElementById('btnBomb').onclick = () => { selectedWeapon = "BOMB"; updateWeaponBtns(); };

    function updateWeaponBtns() {
      document.getElementById('btnHose').className = 'weapon-btn ' + (selectedWeapon === 'HOSE' ? 'active' : '');
      document.getElementById('btnBucket').className = 'weapon-btn ' + (selectedWeapon === 'BUCKET' ? 'active' : '');
      document.getElementById('btnBomb').className = 'weapon-btn ' + (selectedWeapon === 'BOMB' ? 'active' : '');
    }

    function washHose(x, y) {
      dirtyCtx.globalCompositeOperation = 'destination-out';
      dirtyCtx.beginPath();
      dirtyCtx.arc(x, y, 36, 0, Math.PI * 2);
      dirtyCtx.fill();
      dirtyCtx.globalCompositeOperation = 'source-over';
      calculateWasherCleanliness();
    }

    function washBucket(x, y) {
      playBeep(220, 0.3);
      dirtyCtx.globalCompositeOperation = 'destination-out';
      dirtyCtx.beginPath();
      dirtyCtx.arc(x, y, 95, 0, Math.PI * 2);
      dirtyCtx.fill();
      dirtyCtx.globalCompositeOperation = 'source-over';
      shockwaves.push({ x: x, y: y, radius: 10, maxRadius: 100, alpha: 0.9 });
      calculateWasherCleanliness();
    }

    function throwBomb(targetX, targetY) {
      activeBombs.push({
        startX: width / 2,
        startY: height + 30,
        targetX: targetX,
        targetY: targetY,
        currentX: width / 2,
        currentY: height + 30,
        timer: 60,
        totalTime: 60,
        rotation: 0
      });
    }

    function explodeBomb(x, y) {
      playWaterExplosion();
      dirtyCtx.globalCompositeOperation = 'destination-out';
      dirtyCtx.beginPath();
      dirtyCtx.arc(x, y, 175, 0, Math.PI * 2);
      dirtyCtx.fill();
      dirtyCtx.globalCompositeOperation = 'source-over';
      shockwaves.push({ x: x, y: y, radius: 15, maxRadius: 180, alpha: 1.0 });
      calculateWasherCleanliness();
    }

    function calculateWasherCleanliness() {
      if (isWasherWon || currentGame !== 'WASHER') return;
      const imgData = dirtyCtx.getImageData(0, 0, width, height).data;
      let total = 0, clean = 0;
      for (let i = 3; i < imgData.length; i += 64) {
        total++;
        if (imgData[i] === 0) clean++;
      }
      const percent = Math.min(100, Math.round((clean / total) * 100));
      statBadge.innerText = percent + '%';

      if (percent >= 88 && !isWasherWon) {
        isWasherWon = true;
        setHoseSound(false);
        setTimeout(() => {
          triggerWin("نظافة فائقة بمسدس الضغط!", "أتممت تنظيف السجادة بالكامل ببراعة!", "خصم 20%", "WASHER20");
        }, 400);
      }
    }

    /* ================= 2. لعبة رول السجاد السريع (RUNNER - صعب وذكي) ================= */
    let runnerPlayer = { x: 0, targetX: 0, y: 0, score: 0, health: 3, speed: 6 };
    let runnerItems = [];
    let runnerRunning = false;

    function initRunnerGame() {
      hudTitle.innerText = "رول السجاد";
      statBadge.innerText = "صابون: 0/8 | ❤️ 3";
      canvas.style.display = 'block';
      washerWeapons.style.display = 'none';
      nozzleCursor.style.display = 'none';

      runnerPlayer.x = width / 2;
      runnerPlayer.targetX = width / 2;
      runnerPlayer.y = height - 120;
      runnerPlayer.score = 0;
      runnerPlayer.health = 3;
      runnerPlayer.speed = 6.5;
      runnerItems = [];
      runnerRunning = true;
    }

    /* ================= 3. لعبة المغسلة الذكية الديناميكية (FACTORY - Conveyor Belt Action) ================= */
    let factoryRunning = false;
    let factoryTool = "VACUUM"; // VACUUM, FOAM, BRUSH
    let conveyorCarpetY = -200;
    let carpetStains = [];
    let factoryScore = 0;

    function initFactoryGame() {
      hudTitle.innerText = "خط الإنتاج الذكي";
      statBadge.innerText = "النظافة: 0/10";
      canvas.style.display = 'block';
      washerWeapons.style.display = 'none';
      nozzleCursor.style.display = 'none';

      factoryRunning = true;
      conveyorCarpetY = 50;
      factoryScore = 0;
      carpetStains = [];

      // توليد 10 بقع متفرقة على السجادة المتحركة
      for (let i = 0; i < 10; i++) {
        carpetStains.push({
          relX: (Math.random() - 0.5) * (width * 0.55),
          relY: i * 80 + 80,
          cleaned: false,
          type: i % 2 === 0 ? "طين" : "قهوة"
        });
      }
    }

    /* ================= 4. لعبة عجلة الحظ (WHEEL - جوائز متنوعة) ================= */
    const wheelCanvas = document.getElementById('wheelCanvas');
    const wheelCtx = wheelCanvas.getContext('2d');
    const wheelPrizes = [
      { text: "خصم 25%", code: "LUCKY25" },
      { text: "تعطير وتغليف مجاناً", code: "FREESCENT" },
      { text: "خصم 15%", code: "LUCKY15" },
      { text: "غسيل سيارة VIP هدية", code: "VIPCAR" },
      { text: "خصم 10%", code: "LUCKY10" },
      { text: "شحن وتوصيل مجاني", code: "FREESHIP" }
    ];

    function initWheelGame() {
      hudTitle.innerText = "عجلة الحظ";
      statBadge.innerText = "فرصة واحدة";
      wheelUI.style.display = 'flex';
      drawWheel();
    }

    function drawWheel() {
      const numSlices = wheelPrizes.length;
      const sliceAngle = (Math.PI * 2) / numSlices;
      const colors = ['#0284c7', '#0f172a', '#38bdf8', '#1e293b', '#0369a1', '#334155'];

      wheelCtx.clearRect(0, 0, 300, 300);
      for (let i = 0; i < numSlices; i++) {
        wheelCtx.beginPath();
        wheelCtx.fillStyle = colors[i];
        wheelCtx.moveTo(150, 150);
        wheelCtx.arc(150, 150, 145, i * sliceAngle, (i + 1) * sliceAngle);
        wheelCtx.fill();
        wheelCtx.stroke();

        wheelCtx.save();
        wheelCtx.translate(150, 150);
        wheelCtx.rotate(i * sliceAngle + sliceAngle / 2);
        wheelCtx.fillStyle = '#ffffff';
        wheelCtx.font = 'bold 12px Segoe UI';
        wheelCtx.textAlign = 'right';
        wheelCtx.fillText(wheelPrizes[i].text, 135, 4);
        wheelCtx.restore();
      }
    }

    document.getElementById('spinWheelBtn').onclick = () => {
      playBeep(600, 0.4);
      const selectedIndex = Math.floor(Math.random() * wheelPrizes.length);
      const sliceDeg = 360 / wheelPrizes.length;
      const targetDeg = 1800 + (360 - (selectedIndex * sliceDeg + sliceDeg / 2));

      wheelCanvas.style.transform = `rotate(${targetDeg}deg)`;
      document.getElementById('spinWheelBtn').disabled = true;

      setTimeout(() => {
        const prize = wheelPrizes[selectedIndex];
        triggerWin("مبروك! ربحت من عجلة الحظ", `ربحت جائزة حصرية: ${prize.text}`, prize.text, prize.code);
        document.getElementById('spinWheelBtn').disabled = false;
      }, 4200);
    };

    /* أحداث اللمس والتحكم العام */
    window.addEventListener('pointerdown', (e) => {
      if (currentGame === 'WASHER') {
        if (e.target.closest('.weapons-bar') || e.target.closest('.top-bar') || e.target.closest('#winModal')) return;
        unlockAudio();
        if (selectedWeapon === 'HOSE') {
          isWashing = true;
          nozzleCursor.style.display = 'block';
          nozzleCursor.style.left = `${e.clientX}px`;
          nozzleCursor.style.top = `${e.clientY}px`;
          setHoseSound(true);
          washHose(e.clientX, e.clientY);
        } else if (selectedWeapon === 'BUCKET') {
          washBucket(e.clientX, e.clientY);
        } else if (selectedWeapon === 'BOMB') {
          throwBomb(e.clientX, e.clientY);
        }
      } else if (currentGame === 'RUNNER') {
        runnerPlayer.targetX = e.clientX;
      } else if (currentGame === 'FACTORY') {
        // تنظيف البقع في خط الإنتاج باللمس السريع عليها
        carpetStains.forEach(stain => {
          const stainScreenX = (width / 2) + stain.relX;
          const stainScreenY = conveyorCarpetY + stain.relY;
          if (!stain.cleaned && Math.hypot(e.clientX - stainScreenX, e.clientY - stainScreenY) < 45) {
            stain.cleaned = true;
            factoryScore++;
            playBeep(650, 0.1);
            statBadge.innerText = `النظافة: ${factoryScore}/10`;
            if (factoryScore >= 10) {
              factoryRunning = false;
              triggerWin("كفاءة خط الإنتاج 100%!", "قضيت على كل البقع بدقة واحترافية!", "خصم 15%", "FACTORY15");
            }
          }
        });
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (currentGame === 'WASHER' && selectedWeapon === 'HOSE') {
        nozzleCursor.style.left = `${e.clientX}px`;
        nozzleCursor.style.top = `${e.clientY}px`;
        if (isWashing) washHose(e.clientX, e.clientY);
      } else if (currentGame === 'RUNNER') {
        runnerPlayer.targetX = e.clientX;
      }
    });

    window.addEventListener('pointerup', () => {
      if (currentGame === 'WASHER') {
        isWashing = false;
        nozzleCursor.style.display = 'none';
        setHoseSound(false);
      }
    });

    /* حلقة التحديث والرسم الرئيسية */
    function loop() {
      if (currentGame === 'WASHER') {
        ctx.clearRect(0, 0, width, height);
        ctx.drawImage(cleanCanvas, 0, 0);
        ctx.drawImage(dirtyCanvas, 0, 0);

        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const sw = shockwaves[i];
          sw.radius += (sw.maxRadius - sw.radius) * 0.18;
          sw.alpha -= 0.035;
          if (sw.alpha > 0) {
            ctx.save();
            ctx.strokeStyle = `rgba(56, 189, 248, ${sw.alpha})`;
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          } else {
            shockwaves.splice(i, 1);
          }
        }

        for (let i = activeBombs.length - 1; i >= 0; i--) {
          const b = activeBombs[i];
          b.timer--;
          const progress = 1 - (b.timer / b.totalTime);
          b.currentX = b.startX + (b.targetX - b.startX) * progress;
          b.currentY = (b.startY + (b.targetY - b.startY) * progress) - Math.sin(progress * Math.PI) * 140;

          ctx.font = '40px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('💣', b.currentX, b.currentY);

          if (b.timer <= 0) {
            explodeBomb(b.targetX, b.targetY);
            activeBombs.splice(i, 1);
          }
        }

      } else if (currentGame === 'RUNNER' && runnerRunning) {
        ctx.clearRect(0, 0, width, height);

        ctx.fillStyle = '#0b1320';
        ctx.fillRect(0, 0, width, height);

        // خط سير السجاد
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(25, 0, width - 50, height);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.strokeRect(25, 0, width - 50, height);

        runnerPlayer.x += (runnerPlayer.targetX - runnerPlayer.x) * 0.18;
        ctx.font = '36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('🧻', runnerPlayer.x, runnerPlayer.y);

        if (Math.random() < 0.05) {
          const isBad = Math.random() > 0.45;
          runnerItems.push({
            x: 50 + Math.random() * (width - 100),
            y: -30,
            type: isBad ? (Math.random() > 0.5 ? 'MUD' : 'OIL') : 'SOAP'
          });
        }

        for (let i = runnerItems.length - 1; i >= 0; i--) {
          const item = runnerItems[i];
          item.y += runnerPlayer.speed;
          ctx.font = '30px sans-serif';
          ctx.fillText(item.type === 'SOAP' ? '🧼' : (item.type === 'OIL' ? '🛢️' : '☕'), item.x, item.y);

          if (Math.hypot(item.x - runnerPlayer.x, item.y - runnerPlayer.y) < 38) {
            if (item.type === 'SOAP') {
              runnerPlayer.score++;
              playBeep(650, 0.1);
              statBadge.innerText = `صابون: ${runnerPlayer.score}/8 | ❤️ ${runnerPlayer.health}`;
              if (runnerPlayer.score >= 8) {
                runnerRunning = false;
                triggerWin("احتراف وسرعة رول السجاد!", "حققت أعلى نقاط بتفادي كل العوائق!", "خصم 25% (الأعلى)", "RUNNER25");
              }
            } else {
              runnerPlayer.health--;
              playBeep(130, 0.3);
              statBadge.innerText = `صابون: ${runnerPlayer.score}/8 | ❤️ ${runnerPlayer.health}`;
              if (runnerPlayer.health <= 0) {
                runnerRunning = false;
                triggerWin("محاولة جيدة في تفادي البقع!", "حصلت على خصم تشجيعي لتنظيف سجادك وسياراتك!", "خصم 10%", "CLEAN10");
              }
            }
            runnerItems.splice(i, 1);
          } else if (item.y > height + 40) {
            runnerItems.splice(i, 1);
          }
        }

      } else if (currentGame === 'FACTORY' && factoryRunning) {
        ctx.clearRect(0, 0, width, height);

        // رسم سير خط الإنتاج المعدني المتحرك
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, width, height);

        conveyorCarpetY += 1.6; // حركة السير المستمرة
        if (conveyorCarpetY > height) conveyorCarpetY = -700;

        // السجادة الكبيرة المتحركة
        const carpetW = width * 0.75;
        const carpetH = 900;
        const carpetX = (width - carpetW) / 2;

        ctx.fillStyle = '#b91c1c';
        ctx.fillRect(carpetX, conveyorCarpetY, carpetW, carpetH);
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 6;
        ctx.strokeRect(carpetX, conveyorCarpetY, carpetW, carpetH);

        // رسم البقع التفاعلية على السجادة
        carpetStains.forEach(stain => {
          const stainScreenX = (width / 2) + stain.relX;
          const stainScreenY = conveyorCarpetY + stain.relY;

          if (stainScreenY > -50 && stainScreenY < height + 50) {
            if (!stain.cleaned) {
              ctx.fillStyle = stain.type === 'طين' ? '#451a03' : '#1e1b4b';
              ctx.beginPath();
              ctx.arc(stainScreenX, stainScreenY, 26, 0, Math.PI * 2);
              ctx.fill();
              ctx.font = '12px Segoe UI';
              ctx.fillStyle = '#fff';
              ctx.textAlign = 'center';
              ctx.fillText('اضغط هنا!', stainScreenX, stainScreenY + 4);
            } else {
              ctx.fillStyle = '#00e676';
              ctx.font = '22px sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText('✨', stainScreenX, stainScreenY + 6);
            }
          }
        });

        // رأس الماكينة الذكية العلوية
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.fillRect(0, height - 70, width, 70);
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 14px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('المس البقع الداكنة بسرعة لتشغيل رؤوس التنظيف الأوتوماتيكية!', width / 2, height - 30);
      }

      requestAnimationFrame(loop);
    }
    loop();

    // إرسال البيانات للـ Google Sheets وفتح الواتساب بالخصم المحدد
    orderForm.onsubmit = (e) => {
      e.preventDefault();
      const submitBtn = orderForm.querySelector('.submit-btn');
      submitBtn.innerText = "جاري الحجز وتطبيق الخصم...";
      submitBtn.disabled = true;

      const custName = document.getElementById('custName').value.trim();
      const custPhone = document.getElementById('custPhone').value.trim();
      const custAddress = document.getElementById('custAddress').value.trim();
      const serviceType = document.getElementById('serviceType').value;

      const orderPayload = {
        name: custName,
        phone: custPhone,
        address: custAddress,
        service: serviceType,
        code: currentDiscountCode,
        timestamp: new Date().toLocaleString('ar-EG')
      };

      fetch(GOOGLE_SHEETS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(orderPayload)
      }).catch(() => {});

      const msg = `مرحباً مغسلة IN AND OUT ✨\n` +
        `لقد شاركت في تحديات النظافة وفزت بعرض: *${currentDiscountOffer}* 🎉\n\n` +
        `🏷️ *كود الخصم:* ${currentDiscountCode}\n` +
        `👤 *الاسم:* ${custName}\n` +
        `📞 *الموبايل:* ${custPhone}\n` +
        `📍 *العنوان:* ${custAddress}\n` +
        `🚗 *الخدمة المطلوبة:* ${serviceType}\n\n` +
        `أريد تأكيد موعد الاستلام وتطبيق الخصم.`;

      const targetUrl = `https://api.whatsapp.com/send?phone=${BUSINESS_WHATSAPP_PHONE}&text=${encodeURIComponent(msg)}`;
      window.location.href = targetUrl;
    };
  </script>
</body>
</html>
