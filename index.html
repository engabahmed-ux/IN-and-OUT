<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تحدي غسيل السجاد - مغسلة النظافة الذهبية</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      touch-action: none;
      color: #fff;
    }

    /* الشريط العلوي */
    .top-bar {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 20px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 10;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      white-space: nowrap;
    }
    .progress-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: bold;
      color: #38bdf8;
    }
    .progress-bar-bg {
      width: 100px;
      height: 10px;
      background: #334155;
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #00e676);
      transition: width 0.15s ease-out;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    /* فوهة مسدس الضغط التفاعلية */
    #nozzleCursor {
      position: fixed;
      width: 40px;
      height: 40px;
      border: 2px dashed rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 5;
    }

    /* نافذة الفوز وطلب المندوب */
    .win-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .win-modal.active { display: flex; }
    
    .modal-card {
      background: #1e293b;
      border: 2px solid #00e676;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 230, 118, 0.25);
      animation: popIn 0.3s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-card h2 { color: #00e676; font-size: 20px; margin-bottom: 6px; }
    .modal-card p { font-size: 13px; color: #94a3b8; margin-bottom: 14px; }
    
    .discount-badge {
      background: rgba(0, 230, 118, 0.15);
      border: 1px dashed #00e676;
      color: #00e676;
      font-size: 16px;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: inline-block;
    }

    .order-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: right;
    }
    .order-form input, .order-form select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .order-form input:focus { border-color: #00e676; }
    
    .submit-btn {
      background: linear-gradient(135deg, #00e676, #00b0ff);
      color: #0f172a;
      font-size: 15px;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 4px;
      box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="progress-box">
      <span>نسبة النظافة:</span>
      <div class="progress-bar-bg">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span id="progressText">0%</span>
    </div>
  </div>

  <div id="nozzleCursor"></div>
  <canvas id="gameCanvas"></canvas>

  <!-- نافذة الفوز وطلب الخدمة -->
  <div class="win-modal" id="winModal">
    <div class="modal-card">
      <div style="font-size: 40px; margin-bottom: 6px;">✨🎉</div>
      <h2>سجادتك هترجع جديدة بالظبط كده!</h2>
      <p>مبروك! تم تنظيف السجادة بالكامل وحصلت على خصم فوري.</p>
      
      <div class="discount-badge">كود الخصم: CARPET15 (خصم 15%)</div>

      <form class="order-form" id="orderForm">
        <input type="text" id="custName" placeholder="الاسم الكريم" required>
        <input type="tel" id="custPhone" placeholder="رقم الموبايل / واتساب" required>
        <input type="text" id="custAddress" placeholder="العنوان بالتفصيل" required>
        <select id="carpetCount">
          <option value="1 إلى 2 سجادات">عدد السجاد: 1 إلى 2</option>
          <option value="3 إلى 5 سجادات">عدد السجاد: 3 إلى 5 (عرض خاص)</option>
          <option value="أكثر من 5 سجادات">أكثر من 5 سجادات</option>
        </select>
        <button type="submit" class="submit-btn">احجز مندوب الاستلام الآن 🚚</button>
      </form>
    </div>
  </div>

  <script>
    // استبدل برابط Formspree الخاص بك
    const FORMSPREE_ENDPOINT = "https://formspree.io/f/YOUR_FORM_ID";

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const nozzleCursor = document.getElementById('nozzleCursor');
    const winModal = document.getElementById('winModal');
    const orderForm = document.getElementById('orderForm');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    // كانفاس مخفي للرسم النظيف وكانفاس للأوساخ
    const cleanCanvas = document.createElement('canvas');
    const cleanCtx = cleanCanvas.getContext('2d');
    const dirtyCanvas = document.createElement('canvas');
    const dirtyCtx = dirtyCanvas.getContext('2d');

    cleanCanvas.width = dirtyCanvas.width = width;
    cleanCanvas.height = dirtyCanvas.height = height;

    let isWashing = false;
    let washPos = { x: 0, y: 0 };
    let waterParticles = [];
    let isGameWon = false;
    const WASH_RADIUS = 35;

    /* محرك صوت ضغط الماء والرغوة ASMR */
    let audioCtx = null, noiseNode = null, noiseFilter = null, noiseGain = null;

    function initAudio() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

      noiseNode = audioCtx.createBufferSource();
      noiseNode.buffer = noiseBuffer;
      noiseNode.loop = true;

      noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.setValueAtTime(1200, audioCtx.currentTime);
      noiseFilter.Q.setValueAtTime(2, audioCtx.currentTime);

      noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0, audioCtx.currentTime);

      noiseNode.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      noiseNode.start();
    }

    function setWashingSound(active) {
      if (!audioCtx) initAudio();
      if (noiseGain) {
        noiseGain.gain.setTargetAtTime(active ? 0.18 : 0, audioCtx.currentTime, 0.05);
      }
      if (active && navigator.vibrate) {
        navigator.vibrate(40);
      }
    }

    // 1. رسم السجادة النظيفة الملونة (الطبقة السفلية)
    function generateCleanCarpet() {
      // نقشات وزخارف إسلامية ومودرن للسجادة
      cleanCtx.fillStyle = '#b91c1c'; // أحمر ملكي
      cleanCtx.fillRect(0, 0, width, height);

      // إطار ذهبي
      cleanCtx.strokeStyle = '#f59e0b';
      cleanCtx.lineWidth = 14;
      cleanCtx.strokeRect(30, 30, width - 60, height - 60);

      // نقوشات هندسية ملونة في المنتصف
      cleanCtx.fillStyle = '#0284c7';
      cleanCtx.beginPath();
      cleanCtx.arc(width / 2, height / 2, Math.min(width, height) * 0.28, 0, Math.PI * 2);
      cleanCtx.fill();

      cleanCtx.fillStyle = '#fbbf24';
      cleanCtx.beginPath();
      cleanCtx.arc(width / 2, height / 2, Math.min(width, height) * 0.16, 0, Math.PI * 2);
      cleanCtx.fill();

      // تفاصيل خطوط ناعمة
      cleanCtx.strokeStyle = '#ffffff';
      cleanCtx.lineWidth = 4;
      for (let i = 0; i < width; i += 60) {
        cleanCtx.strokeRect(i, 50, 40, height - 100);
      }
    }

    // 2. رسم طبقة الأوساخ والبقع (الطبقة العلوية)
    function generateDirtyLayer() {
      dirtyCtx.fillStyle = '#451a03'; // طبقة طين وأتربة
      dirtyCtx.fillRect(0, 0, width, height);

      // بقع قهوة وشوكولاتة عشوائية
      for (let i = 0; i < 35; i++) {
        dirtyCtx.fillStyle = i % 2 === 0 ? '#1f0d04' : '#2e1065';
        dirtyCtx.beginPath();
        const rx = Math.random() * width;
        const ry = Math.random() * height;
        dirtyCtx.arc(rx, ry, Math.random() * 50 + 20, 0, Math.PI * 2);
        dirtyCtx.fill();
      }
    }

    generateCleanCarpet();
    generateDirtyLayer();

    // إزالة الأوساخ عند الضغط والمسح
    function washAt(x, y) {
      dirtyCtx.globalCompositeOperation = 'destination-out';
      dirtyCtx.beginPath();
      dirtyCtx.arc(x, y, WASH_RADIUS, 0, Math.PI * 2);
      dirtyCtx.fill();
      dirtyCtx.globalCompositeOperation = 'source-over';

      // توليد رذاذ ورغوة ماء متحركة
      for (let i = 0; i < 6; i++) {
        waterParticles.push({
          x: x + (Math.random() - 0.5) * 25,
          y: y + (Math.random() - 0.5) * 25,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          size: Math.random() * 4 + 2,
          alpha: 0.8
        });
      }

      checkCleanliness();
    }

    // حساب نسبة المساحة المنظفة
    let checkThrottle = 0;
    function checkCleanliness() {
      checkThrottle++;
      if (checkThrottle % 15 !== 0 || isGameWon) return;

      const imgData = dirtyCtx.getImageData(0, 0, width, height).data;
      let totalPixels = 0;
      let cleanPixels = 0;

      // فحص عينة سريعة من البكسلات
      for (let i = 3; i < imgData.length; i += 64) {
        totalPixels++;
        if (imgData[i] === 0) cleanPixels++;
      }

      const percent = Math.min(100, Math.round((cleanPixels / totalPixels) * 100));
      progressFill.style.width = percent + '%';
      progressText.innerText = percent + '%';

      if (percent >= 88 && !isGameWon) {
        isGameWon = true;
        setWashingSound(false);
        setTimeout(() => {
          winModal.classList.add('active');
        }, 400);
      }
    }

    // التعامل مع أحداث اللمس والماوس
    const startWash = (e) => {
      isWashing = true;
      washPos = { x: e.clientX, y: e.clientY };
      nozzleCursor.style.display = 'block';
      nozzleCursor.style.left = `${e.clientX}px`;
      nozzleCursor.style.top = `${e.clientY}px`;
      setWashingSound(true);
      washAt(e.clientX, e.clientY);
    };

    const moveWash = (e) => {
      if (!isWashing) return;
      washPos = { x: e.clientX, y: e.clientY };
      nozzleCursor.style.left = `${e.clientX}px`;
      nozzleCursor.style.top = `${e.clientY}px`;
      washAt(e.clientX, e.clientY);
    };

    const endWash = () => {
      isWashing = false;
      nozzleCursor.style.display = 'none';
      setWashingSound(false);
    };

    window.addEventListener('pointerdown', startWash);
    window.addEventListener('pointermove', moveWash);
    window.addEventListener('pointerup', endWash);
    window.addEventListener('pointercancel', endWash);

    // حلقة الرسم والتحديث المستمر
    function render() {
      ctx.clearRect(0, 0, width, height);

      // 1. رسم السجادة النظيفة
      ctx.drawImage(cleanCanvas, 0, 0);

      // 2. رسم طبقة الأوساخ المتبقية فوقها
      ctx.drawImage(dirtyCanvas, 0, 0);

      // 3. رسم رذاذ الماء وفقاعات الرغوة
      for (let i = 0; i < waterParticles.length; i++) {
        const p = waterParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha > 0) {
          ctx.fillStyle = `rgba(224, 242, 254, ${p.alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      waterParticles = waterParticles.filter(p => p.alpha > 0);

      requestAnimationFrame(render);
    }
    render();

    // إرسال طلب حجز المندوب عبر Formspree
    orderForm.onsubmit = (e) => {
      e.preventDefault();
      const submitBtn = orderForm.querySelector('.submit-btn');
      submitBtn.innerText = "جاري الحجز...";
      submitBtn.disabled = true;

      fetch(FORMSPREE_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          الخدمة: "طلب غسيل سجاد (لعبة مسدس الضغط)",
          الاسم: document.getElementById('custName').value,
          الموبايل: document.getElementById('custPhone').value,
          العنوان: document.getElementById('custAddress').value,
          الكمية: document.getElementById('carpetCount').value,
          كود_الخصم: "CARPET15",
          التاريخ: new Date().toLocaleString('ar-EG')
        })
      }).then(() => {
        alert("تم استلام طلبك بنجاح! سيتم التواصل معك هاتفياً لتحديد موعد استلام السجاد 🚚✨");
        location.reload();
      }).catch(() => {
        alert("تم تسجيل طلبك، سنتواصل معك حالاً!");
        location.reload();
      });
    };
  </script>
</body>
</html>
